[project]
name='cast-stage'
version='0.1.0'
description='CAST: live object theatre with constrained Strands rules'
requires-python='>=3.10'
dependencies=['fastapi>=0.110','uvicorn[standard]>=0.27','pydantic>=2.0','httpx>=0.27']
[project.optional-dependencies]
agent=['strands-agents[gemini]==1.55.1','google-genai==1.75.0','boto3>=1.34']
cv=['opencv-contrib-python>=4.10']
test=['pytest>=8.0']
[project.scripts]
cast='cast.app:main'
[tool.setuptools]
packages=['cast']
